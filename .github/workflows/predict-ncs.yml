name: Predict noncentrosymmetry

'on':
  workflow_dispatch:
    inputs:
      formula:
        description: Chemical formula
        required: true
        default: LiNbO3
        type: string
      dataset:
        description: Training database
        required: true
        default: mp
        type: choice
        options:
          - mp
          - cod
      domain:
        description: Chemical domain
        required: true
        default: inorganic
        type: choice
        options:
          - inorganic
          - organic
          - metal-organic
      model:
        description: Learning algorithm
        required: true
        default: lgbm
        type: choice
        options:
          - lgbm
          - rf

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRAINING_DATABASE: ${{ inputs.dataset }}
      CHEMICAL_DOMAIN: ${{ inputs.domain }}
      ALGORITHM: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-inference.txt
      - name: Download the selected model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          model_file="$(python - <<'PY'
          import os
          from predict_ncs import model_run_id

          run_id = model_run_id(
              os.environ["TRAINING_DATABASE"],
              os.environ["CHEMICAL_DOMAIN"],
              os.environ["ALGORITHM"],
          )
          print(f"model_{run_id}.pkl")
          PY
          )"
          gh release download paper-v2-models-v1 --repo "$GITHUB_REPOSITORY" --pattern "$model_file" --dir models
      - name: Install inference dependencies
        run: python -m pip install -r requirements-inference.txt
      - name: Predict noncentrosymmetry
        env:
          FORMULA: ${{ inputs.formula }}
        run: |
          python predict_ncs.py --formula="$FORMULA" --dataset "$TRAINING_DATABASE" \
            --domain "$CHEMICAL_DOMAIN" --model "$ALGORITHM" > prediction.json
          cat prediction.json
          {
            echo '### Noncentrosymmetry prediction'
            echo
            echo '```json'
            cat prediction.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
